<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 Pour Jason 💕</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ffeef8, #ffe0f0, #ffd4e5);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    /* FIX MOBILE SCROLL */
    overflow-x: hidden;
    overflow-y: auto;
}

/* CONTAINER */
.container {
    background: white;
    border-radius: 30px;
    padding: 50px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    border: 3px solid #ff69b4;
    box-shadow: 0 20px 60px rgba(255,105,180,0.3);
    position: relative;
    z-index: 10;
}

h1 {
    color: #ff1493;
    font-size: 3em;
}

.question {
    color: #d946ef;
    font-size: 1.8em;
    margin: 30px 0;
    font-weight: bold;
}

/* PHOTOS */
.photos-container {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin: 30px 0;
    flex-wrap: wrap;
}

.photo-placeholder {
    width: 150px;
    height: 150px;
    border-radius: 20px;
    border: 3px solid #ff69b4;
    overflow: hidden;
    z-index: 5;
}

.photo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* BOUTONS */
.buttons {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin-top: 40px;
    flex-wrap: wrap;
}

button {
    padding: 20px 50px;
    font-size: 1.2em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

#yesBtn {
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: white;
}

#yesBtn:hover {
    transform: scale(1.1);
}

/* Bouton Non fuyard (PC seulement) */
#noBtn {
    background: #ccc;
    position: absolute;
    z-index: 1;
}

/* CELEBRATION */
.celebration {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.95);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

.celebration.active {
    display: flex;
}

/* 📱 MOBILE */
@media (max-width: 600px) {

    .container {
        padding: 25px;
    }

    h1 {
        font-size: 2.2em;
    }

    .question {
        font-size: 1.4em;
    }

    .photos-container {
        flex-direction: column;
    }

    .photo-placeholder {
        width: 200px;
        height: 200px;
    }

    .buttons {
        flex-direction: column;
        gap: 20px;
    }

    button {
        width: 100%;
        padding: 18px;
    }

    #noBtn {
        position: relative; /* PAS fuyard sur mobile */
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>💕 Pour Jason 💕</h1>

    <div class="question">
        Veux-tu être mon Valentin ???
    </div>

    <div class="photos-container">
        <div class="photo-placeholder">
            <img src="image/image1.jpeg" alt="">
        </div>
        <div class="photo-placeholder">
            <img src="image/image2.jpeg" alt="">
        </div>
        <div class="photo-placeholder">
            <img src="image/image3.jpeg" alt="">
        </div>
    </div>

    <div class="buttons">
        <button id="yesBtn" onclick="celebrate()">Oui ma princesse</button>
        <button id="noBtn">Non flemme</button>
    </div>
</div>

<div class="celebration" id="celebration">
    <h2> Je t'aime mon doudou !!! </h2>
    <p style="font-size:2em;color:#ff69b4;">
        Tu resteras mon Valentin pour toujours !!!💕
    </p>
</div>

<script>
const noBtn = document.getElementById('noBtn');

noBtn.addEventListener('mouseover', () => {
    if (window.innerWidth > 600) {
        const x = Math.random() * (window.innerWidth - 150);
        const y = Math.random() * (window.innerHeight - 80);
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
    }
});

function celebrate() {
    document.getElementById('celebration').classList.add('active');
}
</script>

</body>
</html>
