<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 Pour Jason 💕</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd4e5 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

.heart-bg, .flower {
    position: absolute;
    opacity: 0.3;
}

.heart-bg {
    font-size: 30px;
    animation: float 15s infinite ease-in-out;
}

.flower {
    font-size: 40px;
    animation: sway 10s infinite ease-in-out;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-50px); }
}

@keyframes sway {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(20px); }
}

.container {
    background: white;
    border-radius: 30px;
    padding: 50px;
    box-shadow: 0 20px 60px rgba(255,105,180,0.3);
    text-align: center;
    max-width: 600px;
    z-index: 10;
    border: 3px solid #ff69b4;
}

h1 {
    color: #ff1493;
    font-size: 3em;
    margin-bottom: 20px;
}

.question {
    color: #d946ef;
    font-size: 1.8em;
    margin: 30px 0;
    font-weight: bold;
}

.photos-container {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin: 30px 0;
    flex-wrap: wrap;
}

.photo-placeholder {
    width: 150px;
    height: 150px;
    border-radius: 20px;
    border: 3px solid #ff69b4;
    overflow: hidden;
}

.photo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.buttons {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin-top: 40px;
}

button {
    padding: 20px 50px;
    font-size: 1.2em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

#yesBtn {
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: white;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    background: #ccc;
    position: absolute;
}

.celebration {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.95);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.celebration.active {
    display: flex;
}
</style>
</head>

<body>

<div class="container">
<h1>💕 Pour Jason 💕</h1>

<div class="question">
Veux-tu être mon Valentin ???
</div>

<div class="photos-container">
    <div class="photo-placeholder">
        <img src="image/image1" alt="">
    </div>
    <div class="photo-placeholder">
        <img src="image/image2" alt="">
    </div>
    <div class="photo-placeholder">
        <img src="image/image3" alt="">
    </div>
</div>

<div class="buttons">
<button id="yesBtn" onclick="celebrate()">Oui ma princesse</button>
<button id="noBtn">Non flemme</button>
</div>
</div>

<div class="celebration" id="celebration">
<h2> Je t'aime mon doudou !!! </h2>
<p style="font-size:2em;color:#ff69b4;">Tu restera mon Valentin pour toujours! 💕</p>
</div>

<script>
const noBtn = document.getElementById('noBtn');

noBtn.addEventListener('mouseover', function() {
    const randomX = Math.random() * (window.innerWidth - 200);
    const randomY = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';
    noBtn.style.position = 'fixed';
});

function celebrate() {
    document.getElementById('celebration').classList.add('active');
}
</script>

</body>
</html>
